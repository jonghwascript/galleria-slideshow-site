<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Frontend Mentor | Galleria slideshow site</title>
  </head>
  <body>
    <header class="c-header l-cluster">
      <div class="c-header__logo">
        <img src="./images/shared/logo.svg" width="113" height="32" alt="Galleria" />
      </div>
      <button class="c-header__slideshow-button">START SLIDESHOW</button>
    </header>
    <main id="main" class="c-gallery">
      <h1 class="u-sr-only">Art gallery</h1>
      <p class="c-gallery__status" role="status"></p>
      <noscript>Please enable JavaScript to view the gallery.</noscript>
    </main>
    <template id="artwork-card-template">
      <article class="c-artwork-card">
        <img class="c-artwork-card__thumbnail" alt="">
        <div class="c-artwork-card__info l-stack">
          <h2 class="c-artwork-card__title"></h2>
          <p class="c-artwork-card__artist"></p>
        </div>
      </article>
    </template>
    <script src="./js/main.js" defer></script>
  </body>
</html>
